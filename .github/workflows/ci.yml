name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Every Monday: a new vulnerability can affect an unchanged code.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.12.0
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Check
        run: make check

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
