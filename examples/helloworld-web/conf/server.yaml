# Configuration of the example. The web server listens on the port 8080 of the container.
default_locale: en-us
locales:
  en-us:
    default: true
localization_path: localization
templates_path: templates
robots_file_path: conf/robots.txt

server:
  port: 8080

hosts:
  web: http://localhost:8080

jwt:
  # Never write the secret here: read it from the environment, or from a file with !file /run/secrets/jwt_secret.
  secret: !env JWT_SECRET
